<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc"><title id="title">P4 Transwing simulation stack</title><desc id="desc">Engineering estimates connect articulated Gazebo geometry, QuadPlane SITL, and a local dashboard</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,1 L8,5 L0,9" fill="none" stroke="#168c7a" stroke-width="1.5"/></marker></defs><rect width="1200" height="680" rx="24" fill="#f3f7fa"/><text x="42" y="58" font-family="Arial, sans-serif" font-size="32" fill="#17324d" font-weight="700">P4 Transwing simulation stack</text><text x="42" y="93" font-family="Arial, sans-serif" font-size="19" fill="#486277" font-weight="400">Engineering estimates connect articulated Gazebo geometry, QuadPlane SITL, and a local dashboard</text><rect x="42" y="132" width="315" height="165" rx="16" fill="#ffffff" stroke="#c7d7e2" stroke-width="2"/><text x="64" y="170" font-family="Arial, sans-serif" font-size="24" fill="#17324d" font-weight="700">Windows operator</text><text x="64" y="206" font-family="Arial, sans-serif" font-size="20" fill="#486277" font-weight="400">Browser control station</text><text x="64" y="236" font-family="Arial, sans-serif" font-size="20" fill="#486277" font-weight="400">Site configuration + launchers</text><text x="64" y="266" font-family="Arial, sans-serif" font-size="20" fill="#486277" font-weight="400">Optional MKR USB RC bridge</text><rect x="442" y="132" width="315" height="165" rx="16" fill="#e3f5f0" stroke="#168c7a" stroke-width="2"/><text x="464" y="170" font-family="Arial, sans-serif" font-size="24" fill="#17324d" font-weight="700">Python control station</text><text x="464" y="206" font-family="Arial, sans-serif" font-size="20" fill="#486277" font-weight="400">HTTP dashboard + API</text><text x="464" y="236" font-family="Arial, sans-serif" font-size="20" fill="#486277" font-weight="400">MAVLink commands / state</text><text x="464" y="266" font-family="Arial, sans-serif" font-size="20" fill="#486277" font-weight="400">Baseline control only</text><rect x="842" y="132" width="315" height="165" rx="16" fill="#ffffff" stroke="#c7d7e2" stroke-width="2"/><text x="864" y="170" font-family="Arial, sans-serif" font-size="24" fill="#17324d" font-weight="700">ArduPilot SITL</text><text x="864" y="206" font-family="Arial, sans-serif" font-size="20" fill="#486277" font-weight="400">ArduPlane / QuadPlane</text><text x="864" y="236" font-family="Arial, sans-serif" font-size="20" fill="#486277" font-weight="400">P4 parameter profile</text><text x="864" y="266" font-family="Arial, sans-serif" font-size="20" fill="#486277" font-weight="400">Flight dynamics connection</text><rect x="842" y="397" width="315" height="162" rx="16" fill="#ffffff" stroke="#c7d7e2" stroke-width="2"/><text x="864" y="435" font-family="Arial, sans-serif" font-size="24" fill="#17324d" font-weight="700">Gazebo Harmonic</text><text x="864" y="471" font-family="Arial, sans-serif" font-size="20" fill="#486277" font-weight="400">ArduPilotPlugin + physics</text><text x="864" y="501" font-family="Arial, sans-serif" font-size="20" fill="#486277" font-weight="400">Wing-fold joints + rotors</text><text x="864" y="531" font-family="Arial, sans-serif" font-size="20" fill="#486277" font-weight="400">Estimated aerodynamic model</text><rect x="442" y="397" width="315" height="162" rx="16" fill="#ffffff" stroke="#c7d7e2" stroke-width="2"/><text x="464" y="435" font-family="Arial, sans-serif" font-size="24" fill="#17324d" font-weight="700">Experiment modules</text><text x="464" y="471" font-family="Arial, sans-serif" font-size="20" fill="#486277" font-weight="400">Campaigns currently locked</text><text x="464" y="501" font-family="Arial, sans-serif" font-size="20" fill="#486277" font-weight="400">Profiles + telemetry code</text><text x="464" y="531" font-family="Arial, sans-serif" font-size="20" fill="#486277" font-weight="400">Metrics + report code</text><rect x="42" y="397" width="315" height="162" rx="16" fill="#ffffff" stroke="#c7d7e2" stroke-width="2"/><text x="64" y="435" font-family="Arial, sans-serif" font-size="24" fill="#17324d" font-weight="700">Geometry + assumptions</text><text x="64" y="471" font-family="Arial, sans-serif" font-size="20" fill="#486277" font-weight="400">P4-clone reference assets</text><text x="64" y="501" font-family="Arial, sans-serif" font-size="20" fill="#486277" font-weight="400">Visual appearance only</text><text x="64" y="531" font-family="Arial, sans-serif" font-size="20" fill="#486277" font-weight="400">Mass / aero need validation</text><path d="M357 213 H430" fill="none" stroke="#168c7a" stroke-width="3" marker-end="url(#arrow)"/><path d="M757 213 H830" fill="none" stroke="#168c7a" stroke-width="3" marker-end="url(#arrow)"/><path d="M1000 297 V385" fill="none" stroke="#168c7a" stroke-width="3" marker-end="url(#arrow)"/><text x="1015" y="354" font-family="Arial, sans-serif" font-size="18" fill="#168c7a" font-weight="700">simulation link</text><path d="M600 297 V385" fill="none" stroke="#168c7a" stroke-width="3" marker-end="url(#arrow)"/><text x="615" y="354" font-family="Arial, sans-serif" font-size="18" fill="#168c7a" font-weight="700">recording</text><path d="M357 478 H395 V610 H1000 V559" fill="none" stroke="#168c7a" stroke-width="3" marker-end="url(#arrow)"/><text x="42" y="651" font-family="Arial, sans-serif" font-size="21" fill="#17324d" font-weight="700">Simulation model only. P4 reference dimensions and CAD do not validate aircraft performance.</text></svg>
